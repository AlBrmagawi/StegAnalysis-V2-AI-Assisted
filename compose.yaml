services:
  workbench:
    build: .
    volumes:
      - evidence:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 2g
    cpus: 2.0
    init: true
    restart: unless-stopped
    networks: [offline]
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      workbench:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STEG_PORT:-8000}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    networks: [edge, offline]
networks:
  offline:
    internal: true
  edge:
volumes:
  evidence:
